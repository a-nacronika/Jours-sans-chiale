```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jours sans chiale</title>

<style>
@font-face {
  font-family: "Tritopani";
  src: url("tritopani.ttf") format("truetype");
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #f4eee0;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.page {
  position: relative;
  width: min(100%, 768px);
  line-height: 0;
}

.artwork {
  display: block;
  width: 100%;
  height: auto;
}

/* Zona del contador real, dentro del marco de perlas */
.counter {
  position: absolute;
  top: 43.1%;
  left: 34.1%;
  width: 31.8%;
  height: 7.7%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  align-items: center;
  justify-items: center;
  gap: 2%;
  padding: 1%;
  background: #f4eddf;
  line-height: 1;
}

.digit {
  font-family: "Tritopani", Georgia, serif;
  color: #956267;
  font-size: clamp(24px, 7.5vw, 66px);
  font-weight: normal;
  line-height: 1;
}

@media (min-width: 769px) {
  .digit {
    font-size: 58px;
  }
}
</style>
</head>

<body>
  <main class="page">
    <img
      class="artwork"
      src="fond.png"
      alt=""
    >

    <div class="counter" aria-label="Días transcurridos">
      <span class="digit" id="hundreds">0</span>
      <span class="digit" id="tens">0</span>
      <span class="digit" id="units">0</span>
    </div>
  </main>

<script>
  // Cambiá esta fecha por el día desde el que querés contar.
  const dateDepart = "2026-01-01";

  function updateCounter() {
    const debut = new Date(dateDepart + "T00:00:00");
    const maintenant = new Date();

    debut.setHours(0, 0, 0, 0);
    maintenant.setHours(0, 0, 0, 0);

    const jours = Math.max(
      0,
      Math.floor((maintenant - debut) / 86400000)
    );

    const chiffres = String(jours).slice(-3).padStart(3, "0");

    document.getElementById("hundreds").textContent = chiffres[0];
    document.getElementById("tens").textContent = chiffres[1];
    document.getElementById("units").textContent = chiffres[2];
  }

  updateCounter();
  setInterval(updateCounter, 60000);
</script>
</body>
</html>
```
